<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <!-- 📱 Mobil qurilmalar ekraniga moslashish uchun eng muhim teg -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Verifikatsiyali Neon Test Tizimi</title>
    <style>
        /* 📜 Umumiy Sozlamalar */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            padding: 15px; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 📦 Asosiy Konteyner (Moslashuvchan) */
        .container { 
            max-width: 600px; 
            width: 100%; 
            background: #161b22; 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.15); 
            box-sizing: border-box;
        }

        h1 { 
            color: #00e676; 
            text-align: center; 
            font-size: 24px;
            margin-top: 0;
        }

        /* ⌨️ Kiritish maydonlari */
        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #fff; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            font-size: 16px; /* ⚠️ Mobilda klaviatura ochilganda ekran kattalashib ketmasligi uchun 16px shart */
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #00e676;
            outline: none;
        }

        /* 📝 Savollar Kartochkasi */
        .question-card { 
            background: #21262d; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border-left: 5px solid #00e676; 
        }

        .question-card p {
            margin-top: 0;
            font-size: 17px;
            line-height: 1.4;
        }

        /* 🔘 Variantlar (Sensorli ekranlar uchun katta va qulay) */
        .options label { 
            display: flex;
            align-items: center;
            background: #30363d; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 8px; 
            cursor: pointer; 
            user-select: none;
            transition: background 0.2s;
            font-size: 15px;
        }

        .options label:hover { 
            background: #444c56; 
        }

        .options input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #00e676; /* Radio tugmachani neon rangga bo'yash */
        }

        /* 🚀 Tugmalar */
        button { 
            width: 100%; 
            background: #00e676; 
            color: #0d1117; 
            border: none; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-bottom: 10px; 
            transition: background 0.2s;
        }

        button:hover {
            background: #00c853;
        }

        .hidden { display: none; }
        
        #status { 
            text-align: center; 
            font-weight: bold; 
            margin: 15px 0 0 0; 
            color: #ff6b6b; 
            font-size: 15px;
        }

        /* 📱 Ekran o'lchamiga qarab moslashish (Media Queries) */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 20px;
            }
            .question-card {
                padding: 15px;
            }
            .options label {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Neon Database Quiz</h1>
    
    <!-- 1-BOSQICH: VERIFIKATSIYA BLOKI -->
    <div id="auth-block">
        <p style="text-align:center; color:#8b949e; font-size: 14px; line-height: 1.4;">Avval Telegram botimizga kirib <b>/start</b> bosing va ID raqamingizni oling.</p>
        <input type="text" id="fullName" placeholder="Sertifikat uchun to'liq ismingiz...">
        <input type="number" id="telegramId" placeholder="Telegram ID raqamingiz...">
        <button onclick="sendCode()">Telegramga Kod Yuborish</button>
        
        <div id="code-input-block" class="hidden">
            <input type="text" id="verifyCode" placeholder="Telegram bot yuborgan 4 xonali kod...">
            <button style="background:#58a6ff; color:#fff;" onclick="verifyCode()">Kodni Tasdiqlash va Testni Boshlash</button>
        </div>
    </div>

    <!-- 2-BOSQICH: TEST BLOKI -->
    <div id="quiz-block" class="hidden">
        <div id="quiz-container"></div>
        <button onclick="submitQuiz()">Testni Yakunlash va Sertifikat Olish</button>
    </div>

    <div id="status"></div>
</div>

<script>
    let questionsData = [];
    let savedTelegramId = '';
    let savedFullName = '';

    const statusDiv = document.getElementById('status');

    async function sendCode() {
        const fullName = document.getElementById('fullName').value.trim();
        const telegramId = document.getElementById('telegramId').value.trim();
        
        if(!fullName || !telegramId) return alert("Barcha maydonlarni to'ldiring!");
        
        savedFullName = fullName;
        savedTelegramId = telegramId;
        statusDiv.style.color = '#58a6ff';
        statusDiv.innerText = "Kod yuborilmoqda...";

        const res = await fetch('/api/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegramId })
        });
        const data = await res.json();

        if(data.success) {
            statusDiv.style.color = '#00e676';
            statusDiv.innerText = data.message;
            document.getElementById('code-input-block').classList.remove('hidden');
        } else {
            statusDiv.style.color = '#ff6b6b';
            statusDiv.innerText = data.error;
        }
    }

    async function verifyCode() {
        const code = document.getElementById('verifyCode').value.trim();
        if(!code) return alert("Kodni kiriting!");

        const res = await fetch('/api/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ telegramId: savedTelegramId, code })
        });
        const data = await res.json();

        if(data.success) {
            statusDiv.innerText = "";
            document.getElementById('auth-block').classList.add('hidden');
            document.getElementById('quiz-block').classList.remove('hidden');
            
            questionsData = data.questions;
            
            let quizHTML = '';
            questionsData.forEach((q, idx) => {
                quizHTML += `
                    <div class="question-card">
                        <p><strong>${idx + 1}. ${q.question}</strong></p>
                        <div class="options">
                `;
                
                q.options.forEach((opt, oIdx) => {
                    quizHTML += `
                        <label>
                            <input type="radio" name="question_${q.id}" value="${oIdx}"> ${opt}
                        </label>
                    `;
                });
                
                quizHTML += `
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('quiz-container').innerHTML = quizHTML;
        } else {
            statusDiv.style.color = '#ff6b6b';
            statusDiv.innerText = data.error;
        }
    }

    async function submitQuiz() {
        const answers = {};
        questionsData.forEach(q => {
            const checked = document.querySelector(`input[name="question_${q.id}"]:checked`);
            if(checked) answers[q.id] = checked.value;
        });

        if(Object.keys(answers).length < questionsData.length) return alert("Hamma savollarni belgilang!");

        statusDiv.style.color = '#00e676';
        statusDiv.innerText = "Tekshirilmoqda...";

        const response = await fetch('/api/submit-quiz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName: savedFullName, telegramId: savedTelegramId, answers })
        });

        if (response.headers.get('Content-Type') === 'application/pdf') {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `Sertifikat_${savedFullName}.pdf`; a.click();
            statusDiv.innerText = "Tabriklaymiz! Sertifikatingiz yuklab olindi va Telegram botingizga bildirishnoma yuborildi 🎉";
        } else {
            const data = await response.json();
            statusDiv.style.color = '#ff6b6b';
            statusDiv.innerText = data.message;
        }
    }
</script>
</body>
</html>
